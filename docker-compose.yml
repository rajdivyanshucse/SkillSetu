services:
  # ==========================================
  # 1. PostgreSQL 16 + pgvector Database Engine
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skillsetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillsetu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-skillsetu_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Python FastAPI AI Microservice
  # ==========================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: skillsetu-ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8001
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-sk-skillsetu-ai-dev-secret-key}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-50000}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - backend-net
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; res = urllib.request.urlopen('http://localhost:8001/health', timeout=3); exit(0 if res.getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================
  # 3. Node.js Express Core Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillsetu-backend
    restart: unless-stopped
    dependsOn:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-skillsetu_db}?schema=public
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-sk-skillsetu-ai-dev-secret-key}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-5000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      API_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-skillsetu-prod-access-secret-32-chars-minimum}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-skillsetu-prod-refresh-secret-32-chars-minimum}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-1mb}
    networks:
      - backend-net
      - frontend-net
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ==========================================
  # 4. React Production Frontend (Nginx SPA)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: skillsetu-frontend
    restart: unless-stopped
    dependsOn:
      backend:
        condition: service_healthy
    networks:
      - frontend-net
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# ==========================================
# Volumes & Networks Definitions
# ==========================================
volumes:
  postgres_data:
    driver: local
  huggingface_cache:
    driver: local

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge
